[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mobilerun-autotest"
version = "3.0.0"
description = "AI-powered mobile automation testing framework using MobileAgent API"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "MobileRun Team"}
]
keywords = ["mobile", "testing", "automation", "ai", "android", "ios"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
mobilerun-autotest = "mobilerun_autotest.cli:main"

[project.urls]
Homepage = "https://github.com/droidrun/mobilerun"
Documentation = "https://github.com/droidrun/mobilerun/tree/main/mobilerun_auto_test"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mobilerun_autotest = ["py.typed"]
