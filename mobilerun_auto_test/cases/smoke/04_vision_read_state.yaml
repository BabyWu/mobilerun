id: vision_read_state
title: Vision Mode - Read Device State
priority: smoke

preconditions:
  - Device connected
  - Vision-capable LLM configured

setup: |
  mobilerun device press home

steps:
  - Look at the current screen and describe what you see

run_flags:
  vision: true
  reasoning: false
  steps: 5

verify:
  - cmd: "mobilerun device screenshot"
    save_to: vision-state.png
  - judge: ai_vision
    description: "Screenshot shows a valid Android screen (home screen or app)"

timeout: 120
pass_criteria: "Screenshot captures valid device screen"

cleanup: |
  mobilerun device press home
