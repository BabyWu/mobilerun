id: device_actions
title: Basic Device Actions
priority: smoke

preconditions:
  - Android device connected

verify:
  - cmd: "mobilerun device ui"
    expect_regex: "package|activity|node"
    description: "Device UI tree returns valid data"
    capture: ui_output
    capture_from: all
  - cmd: "mobilerun device screenshot"
    save_to: device-state.png

timeout: 60
pass_criteria: "Device UI tree returns data and screenshot saved"
